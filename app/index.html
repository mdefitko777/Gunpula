<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gunpula Catalog</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="catalog-page">
      <header class="page-header">
        <div class="brand-line">
          <span class="brand-mark">G</span>
          <span>Gunpula Catalog</span>
        </div>
        <div class="title-row">
          <div>
            <h1>模型目录</h1>
            <p id="datasetSummary">Loading catalog...</p>
          </div>
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索模型名称或作品" />
          </label>
        </div>
        <div class="filter-group">
          <div class="filter-label">等级</div>
          <div class="chip-bar" id="gradeList" aria-label="按等级筛选"></div>
        </div>
        <div class="filter-group">
          <div class="filter-label">作品出处</div>
          <div class="chip-bar" id="workList" aria-label="按作品出处筛选"></div>
        </div>
      </header>

      <section class="kit-section">
        <div class="section-head">
          <h2>模型列表</h2>
          <span id="resultCount">0 results</span>
        </div>
        <div class="kit-grid" id="kitGrid"></div>
      </section>
    </main>

    <template id="kitCardTemplate">
      <article class="kit-card">
        <div class="box-art"></div>
        <div class="kit-info">
          <h3></h3>
          <p></p>
        </div>
      </article>
    </template>

    <dialog class="detail-dialog" id="detailDialog" aria-labelledby="detailTitle">
      <div class="detail-shell">
        <button class="dialog-close" id="detailClose" type="button" aria-label="关闭详情">×</button>
        <div class="detail-media">
          <div class="detail-main-image" id="detailMainImage"></div>
          <div class="detail-thumbs" id="detailThumbs" aria-label="展示图"></div>
        </div>
        <div class="detail-info">
          <div class="detail-kicker" id="detailKicker"></div>
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle"></p>
          <dl class="detail-meta" id="detailMeta"></dl>
          <a class="official-link" id="detailOfficialLink" target="_blank" rel="noreferrer">官方商品页</a>
        </div>
      </div>
    </dialog>

    <script type="module" src="./main.js"></script>
  </body>
</html>
