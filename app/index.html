<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gunpula Catalog</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="catalog-page">
      <header class="page-header">
        <div class="brand-line">
          <span class="brand-mark">G</span>
          <span>Gunpula Catalog</span>
        </div>
        <div class="title-row">
          <div>
            <h1>模型目录</h1>
            <p id="datasetSummary">Loading catalog...</p>
          </div>
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索模型名称或作品" />
          </label>
        </div>
        <div class="grade-filter-bar" id="gradeList" aria-label="按系列筛选"></div>
      </header>

      <section class="kit-section">
        <div class="section-head">
          <h2>模型列表</h2>
          <span id="resultCount">0 results</span>
        </div>
        <div class="kit-grid" id="kitGrid"></div>
      </section>
    </main>

    <template id="kitCardTemplate">
      <article class="kit-card">
        <div class="box-art"></div>
        <div class="kit-info">
          <h3></h3>
          <p></p>
        </div>
      </article>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
