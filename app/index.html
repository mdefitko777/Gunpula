<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17191d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Gunpla DB" />
    <title>Gunpula Catalog</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260617-history" />
  </head>
  <body>
    <main class="catalog-page">
      <header class="page-header">
        <div class="top-bar">
          <div class="brand-line">
            <span class="brand-mark">G</span>
            <span>Gunpla DB</span>
          </div>
          <div class="segmented-control franchise-control" id="franchiseList" aria-label="选择作品分类"></div>
          <button class="settings-button" id="settingsOpen" type="button" aria-label="设置" data-i18n-aria="settings">⚙</button>
        </div>
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索名字 / 系列 / 产品线" data-i18n-placeholder="searchPlaceholder" />
        </label>
        <nav class="series-tabs" id="seriesTabs" aria-label="常用系列"></nav>
        <details class="filter-panel" id="filtersPanel">
          <summary>
            <span data-i18n="filters">筛选</span>
            <span id="filterSummary">全部系列 · 全部产品线</span>
          </summary>
          <div class="filter-body">
            <label class="select-filter">
              <span data-i18n="workSource">系列</span>
              <select id="seriesSelect"></select>
            </label>
            <label class="select-filter">
              <span data-i18n="productLine">产品线</span>
              <select id="gradeSelect"></select>
            </label>
          </div>
        </details>
      </header>

      <section class="collection-section" id="collectionSection" hidden>
        <div class="collection-panel" id="ownedPanel">
          <div class="collection-head">
            <h2 data-i18n="ownedList">已购买</h2>
            <span id="ownedCount">0</span>
          </div>
          <div class="collection-strip" id="ownedStrip"></div>
        </div>
        <div class="collection-panel" id="wantedPanel">
          <div class="collection-head">
            <h2 data-i18n="wantedList">想要</h2>
            <span id="wantedCount">0</span>
          </div>
          <div class="collection-strip" id="wantedStrip"></div>
        </div>
      </section>

      <section class="kit-section">
        <div class="section-head">
          <h2 id="sectionTitle" data-i18n="catalogList">模型列表</h2>
          <span id="resultCount">0 results</span>
        </div>
        <div class="kit-grid" id="kitGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
      <button type="button" data-view="catalog" class="is-active"><span>⌕</span><strong data-i18n="catalogList">目录</strong></button>
      <button type="button" data-view="owned"><span>✓</span><strong data-i18n="ownedList">已购买</strong></button>
      <button type="button" data-view="wanted"><span>☆</span><strong data-i18n="wantedList">想要</strong></button>
      <button type="button" data-view="settings"><span>⚙</span><strong data-i18n="settings">设置</strong></button>
    </nav>

    <template id="kitCardTemplate">
      <article class="kit-card">
        <div class="box-art"></div>
        <div class="kit-info">
          <div class="kit-badges"></div>
          <h3></h3>
          <p></p>
        </div>
      </article>
    </template>

    <dialog class="detail-dialog" id="detailDialog" aria-labelledby="detailTitle">
      <div class="detail-shell">
        <button class="dialog-close" id="detailClose" type="button" aria-label="关闭详情" data-i18n-aria="closeDetail">×</button>
        <div class="detail-media">
          <button class="gallery-nav gallery-nav-prev" id="galleryPrev" type="button" aria-label="上一张" data-i18n-aria="previousImage">‹</button>
          <div class="detail-main-image" id="detailMainImage"></div>
          <button class="gallery-nav gallery-nav-next" id="galleryNext" type="button" aria-label="下一张" data-i18n-aria="nextImage">›</button>
          <div class="detail-thumbs" id="detailThumbs" aria-label="展示图"></div>
        </div>
        <div class="detail-info">
          <div class="detail-kicker" id="detailKicker"></div>
          <h2 id="detailTitle"></h2>
          <p id="detailSubtitle"></p>
          <div class="status-actions" id="detailStatusActions">
            <button id="toggleOwned" type="button" data-i18n="markOwned">已购买</button>
            <button id="toggleWanted" type="button" data-i18n="markWanted">想要</button>
          </div>
          <div class="wanted-quantity-control" id="wantedQuantityControl" hidden>
            <span data-i18n="wantedQuantity">想要数量</span>
            <div class="wanted-stepper">
              <button id="wantedQuantityMinus" type="button" aria-label="减少想要数量" data-i18n-aria="decreaseWantedQuantity">−</button>
              <input id="wantedQuantityInput" type="number" min="1" max="99" step="1" inputmode="numeric" value="1" aria-label="想要数量" data-i18n-aria="wantedQuantity" />
              <button id="wantedQuantityPlus" type="button" aria-label="增加想要数量" data-i18n-aria="increaseWantedQuantity">+</button>
            </div>
          </div>
          <dl class="detail-meta" id="detailMeta"></dl>
          <a class="official-link" id="detailOfficialLink" target="_blank" rel="noreferrer" data-i18n="officialPage">官方商品页</a>
          <section class="correction-panel" aria-label="手动更正">
            <button class="secondary-button" id="editToggle" type="button" data-i18n="manualCorrection">手动更正</button>
            <div class="correction-form" id="correctionForm" hidden>
              <label>
                <span data-i18n="nameZh">中文名</span>
                <input id="editNameZh" type="text" />
              </label>
              <label>
                <span data-i18n="nameKo">한국어 이름</span>
                <input id="editNameKo" type="text" />
              </label>
              <label>
                <span data-i18n="nameEn">English name</span>
                <input id="editNameEn" type="text" />
              </label>
              <label>
                <span data-i18n="nameJa">日本語名</span>
                <input id="editNameJa" type="text" />
              </label>
              <label>
                <span data-i18n="productLine">产品线 / 等级</span>
                <select id="editGradeCode"></select>
              </label>
              <label>
                <span data-i18n="subline">子系列</span>
                <input id="editSubline" type="text" />
              </label>
              <label>
                <span data-i18n="workSource">系列</span>
                <select id="editSeriesKey"></select>
              </label>
              <label>
                <span data-i18n="universe">宇宙 / 纪年</span>
                <input id="editUniverse" type="text" placeholder="例如 CE / UC / AD" />
              </label>
              <div class="correction-actions">
                <button id="saveCorrection" type="button" data-i18n="saveCorrection">保存更正</button>
                <button id="clearCorrection" type="button" data-i18n="clearCorrection">清除本条</button>
                <button id="exportCorrections" type="button" data-i18n="exportCorrections">导出更正</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </dialog>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="settings-shell">
        <button class="dialog-close settings-close" id="settingsClose" type="button" aria-label="关闭设置" data-i18n-aria="closeSettings">×</button>
        <h2 id="settingsTitle" data-i18n="settings">设置</h2>
        <p id="datasetSummary">Loading catalog...</p>
        <section class="settings-section">
          <h3 data-i18n="language">语言</h3>
          <div class="segmented-control language-control" id="languageList" aria-label="选择语言"></div>
        </section>
        <section class="settings-section sync-section">
          <div class="settings-section-head">
            <h3 data-i18n="sharedSync">共享同步</h3>
            <span class="sync-state" id="syncState"><span class="sync-dot"></span><span id="syncStatusText">本地模式</span></span>
          </div>
          <div class="sync-grid">
            <label>
              <span data-i18n="supabaseUrl">Supabase URL</span>
              <input id="syncSupabaseUrl" type="url" inputmode="url" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="supabaseAnonKey">Anon key</span>
              <input id="syncAnonKey" type="password" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="workspaceId">共享空间 ID</span>
              <input id="syncWorkspaceId" type="text" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="workspaceSecret">共享密码</span>
              <input id="syncWorkspaceSecret" type="password" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="editorSecret">编辑密码</span>
              <input id="syncEditorSecret" type="password" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="memberName">你的名字</span>
              <input id="syncMemberName" type="text" autocomplete="name" />
            </label>
          </div>
          <div class="sync-actions">
            <button id="saveSyncConfig" type="button" data-i18n="saveSyncConfig">保存并连接</button>
            <button id="syncNow" type="button" data-i18n="syncNow">立即同步</button>
            <button id="disconnectSync" type="button" data-i18n="disconnectSync">断开云同步</button>
          </div>
          <p class="settings-hint" id="syncHint" data-i18n="syncHint">同一个共享空间 ID 和密码会共用收藏与更正。</p>
          <button class="install-button" id="installApp" type="button" hidden data-i18n="installApp">安装到手机</button>
        </section>
        <section class="settings-section">
          <div class="settings-section-head">
            <h3 data-i18n="appUpdate">应用更新</h3>
          </div>
          <div class="app-update-row">
            <button id="refreshAppCache" type="button" data-i18n="refreshAppCache">检查更新</button>
            <span id="refreshAppStatus" data-i18n="refreshAppHint">清理程序缓存并重新载入最新版本，不会删除收藏。</span>
          </div>
        </section>
        <section class="settings-section app-health-section">
          <h3 data-i18n="appHealth">最大问题</h3>
          <ul class="issue-list">
            <li><span data-i18n="issueInstall">安卓安装</span><strong data-i18n="issueInstallStatus">已支持 PWA</strong></li>
            <li><span data-i18n="issueSync">两人数据互通</span><strong id="issueSyncStatus">未配置云端</strong></li>
            <li><span data-i18n="issueImages">官方图片稳定性</span><strong data-i18n="issueImagesStatus">已启用本机图片缓存</strong></li>
            <li><span data-i18n="issueRefresh">官方数据更新</span><strong data-i18n="issueRefreshStatus">已提供定时刷新工作流</strong></li>
            <li><span data-i18n="issueConflict">冲突处理</span><strong data-i18n="issueConflictStatus">后同步覆盖，显示最后修改</strong></li>
          </ul>
        </section>
        <section class="settings-section">
          <label class="toggle-row">
            <span data-i18n="consoleMode">控制台模式</span>
            <input id="consoleModeToggle" type="checkbox" />
          </label>
        </section>
        <section class="settings-section console-only" id="seriesAdminPanel" hidden>
          <div class="settings-section-head">
            <h3 data-i18n="seriesAdmin">系列名称</h3>
            <span id="seriesAdminSummary">当前分类 · 当前语言</span>
          </div>
          <div class="series-admin-body">
            <label class="select-filter">
              <span data-i18n="workSource">系列</span>
              <select id="seriesAdminSeries"></select>
            </label>
            <label class="select-filter">
              <span data-i18n="displayLanguage">显示语言</span>
              <select id="seriesAdminLanguage"></select>
            </label>
            <label class="series-name-field">
              <span data-i18n="seriesName">系列名</span>
              <input id="seriesAdminLabel" type="text" />
            </label>
            <div class="series-admin-actions">
              <button id="saveSeriesLabel" type="button" data-i18n="saveSeriesName">保存系列名</button>
              <button id="clearSeriesLabel" type="button" data-i18n="clearSeriesName">清除本语言</button>
              <button id="exportSeriesLabels" type="button" data-i18n="exportSeriesNames">导出系列名</button>
            </div>
          </div>
        </section>
      </div>
    </dialog>

    <script type="module" src="./main.js?v=20260618-collections"></script>
  </body>
</html>
