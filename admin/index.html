<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Atlas CMS</title>
    <link rel="stylesheet" href="./styles.css?v=20260727-cms2" />
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true">
      <defs>
        <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></symbol>
        <symbol id="i-package" viewBox="0 0 24 24"><path d="m7.5 4.3 9 5.2v10l-9 5.2-9-5.2v-10l9-5.2Z" transform="translate(4.5 -2.5) scale(.75)"/><path d="M5 8.5 12 12l7-3.5M12 12v8"/></symbol>
        <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 3v5M5 8h14M5 8v5M12 8v5M19 8v5"/><rect x="2" y="13" width="6" height="6" rx="1"/><rect x="9" y="13" width="6" height="6" rx="1"/><rect x="16" y="13" width="6" height="6" rx="1"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></symbol>
        <symbol id="i-radar" viewBox="0 0 24 24"><path d="M4.9 19.1a10 10 0 1 1 14.2 0M7.8 16.2a6 6 0 1 1 8.4 0M10.6 13.4a2 2 0 1 1 2.8 0"/><path d="m12 12 6-6"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
        <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
        <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M14 5c3-3 6-2 6-2s1 3-2 6l-5 5-4-4 5-5Z"/><path d="m9 10-4 1-2 3 6 1m4-1 1 6 3-2 1-4M8 17l-3 3"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4Z"/><path d="m14 7 3 3"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4"/><path d="M5 12h8a6 6 0 0 1 6 6"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l3-3a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-3 3a4 4 0 0 1-6 0"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></symbol>
      </defs>
    </svg>

    <section class="auth-screen" id="authScreen">
      <div class="auth-mark">A</div>
      <div class="auth-copy">
        <span>ATLAS OPERATIONS</span>
        <h1>内容管理后台</h1>
        <p>商品、分类、图片和抓取结果只在这里编辑。正式 App 只读取审核发布后的数据。</p>
      </div>
      <form class="auth-form" id="authForm">
        <label>管理员邮箱<input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" required /></label>
        <label id="codeLabel" hidden>验证码<input id="authCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6 位验证码" /></label>
        <button class="primary-button" id="authSubmit" type="submit">发送验证码</button>
        <p id="authStatus">使用 Supabase 管理员账号登录。</p>
      </form>
    </section>

    <div class="cms-shell" id="cmsShell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span>A</span>
          <div><strong>Atlas CMS</strong><small>CONTENT OPERATIONS</small></div>
        </div>
        <nav id="mainNav">
          <button data-section="overview"><svg><use href="#i-layout"/></svg><span>总览</span></button>
          <button data-section="products"><svg><use href="#i-package"/></svg><span>商品目录</span><em id="navProductCount">0</em></button>
          <button data-section="taxonomy"><svg><use href="#i-tree"/></svg><span>分类体系</span></button>
          <button data-section="media"><svg><use href="#i-image"/></svg><span>图片资产</span></button>
          <button data-section="harvest"><svg><use href="#i-radar"/></svg><span>抓取中心</span></button>
          <button data-section="duplicates"><svg><use href="#i-copy"/></svg><span>重复处理</span><em id="navDuplicateCount">0</em></button>
          <button data-section="changes"><svg><use href="#i-history"/></svg><span>变更记录</span><em id="navDraftCount">0</em></button>
          <button data-section="releases"><svg><use href="#i-rocket"/></svg><span>发布版本</span></button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>
          <div><strong id="adminName">Administrator</strong><small id="adminEmail"></small></div>
          <button id="logoutButton" type="button" title="退出登录"><svg><use href="#i-x"/></svg></button>
        </div>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <div class="page-title"><span id="pageEyebrow">CONTENT</span><h1 id="pageTitle">总览</h1></div>
          <label class="global-search"><svg><use href="#i-search"/></svg><input id="globalSearch" type="search" placeholder="搜索商品 ID、名称、作品或标签" /></label>
          <div class="top-actions">
            <button class="quiet-button" id="undoLatest" type="button" disabled><svg><use href="#i-undo"/></svg><span>撤销</span></button>
            <button class="quiet-button" id="previewButton" type="button"><svg><use href="#i-eye"/></svg><span>预览 App</span></button>
            <button class="publish-button" id="publishButton" type="button"><svg><use href="#i-upload"/></svg><span>发布</span><em id="publishCount">0</em></button>
          </div>
        </header>
        <div class="workspace-layout" id="workspaceLayout">
          <section class="workspace" id="workspace"></section>
          <aside class="inspector" id="inspector" hidden></aside>
        </div>
      </main>
    </div>

    <dialog class="confirm-dialog" id="confirmDialog">
      <form method="dialog">
        <div class="dialog-icon"><svg><use href="#i-check"/></svg></div>
        <h2 id="confirmTitle">确认操作</h2>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
          <button value="cancel" class="quiet-button">取消</button>
          <button value="confirm" class="primary-button" id="confirmAction">确认</button>
        </div>
      </form>
    </dialog>

    <dialog class="publish-dialog" id="publishDialog">
      <form method="dialog" id="publishForm">
        <header><div><span>RELEASE</span><h2>发布到正式 App</h2></div><button value="cancel" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
        <div class="publish-summary" id="publishSummary"></div>
        <label>版本说明<textarea id="publishNote" rows="3" placeholder="例如：修正 SEED 分类并合并 12 条重复商品"></textarea></label>
        <p>发布后所有网页和 Android 客户端会读取相同的正式补丁；基础抓取数据不会被改写。</p>
        <footer><button value="cancel" class="quiet-button">继续检查</button><button value="default" class="publish-button" id="publishConfirm"><svg><use href="#i-rocket"/></svg>确认发布</button></footer>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./main.js?v=20260727-cms2"></script>
  </body>
</html>
