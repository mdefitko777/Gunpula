# Editing this file re-runs the build and refreshes the android-latest release.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "sw.js"
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare_android_www.mjs"
      - "capacitor.config.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Stage web assets
        run: npm run android:www

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gunpula-debug.apk

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured; skipping signed APK."
            exit 0
          fi
          echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          printf '%s\n' \
            "storeFile=release.keystore" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/signing.properties
          node <<'NODE'
          const fs = require("fs");
          const path = "android/app/build.gradle";
          let text = fs.readFileSync(path, "utf8");
          if (!text.includes("gunpulaSigningProps")) {
            text = `def gunpulaSigningProps = new Properties()
def gunpulaSigningFile = rootProject.file("signing.properties")
if (gunpulaSigningFile.exists()) {
    gunpulaSigningProps.load(new FileInputStream(gunpulaSigningFile))
}

` + text;
            text = text.replace(/android\s*\{/, `android {
    signingConfigs {
        release {
            storeFile file(gunpulaSigningProps["storeFile"] ?: "release.keystore")
            storePassword gunpulaSigningProps["storePassword"]
            keyAlias gunpulaSigningProps["keyAlias"]
            keyPassword gunpulaSigningProps["keyPassword"]
        }
    }`);
            text = text.replace(/release\s*\{/, `release {
            signingConfig signingConfigs.release`);
          }
          fs.writeFileSync(path, text);
          NODE

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../gunpula-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gunpula-android-apk
          path: |
            gunpula-debug.apk
            gunpula-release.apk
          if-no-files-found: ignore

      - name: Publish APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Android APK" \
              --notes "Latest APK built from main. gunpula-debug.apk is always published; gunpula-release.apk appears when release signing secrets are configured."
          gh release upload android-latest gunpula-debug.apk --clobber
          if [ -f gunpula-release.apk ]; then
            gh release upload android-latest gunpula-release.apk --clobber
          fi
