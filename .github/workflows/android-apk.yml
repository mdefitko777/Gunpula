# Editing this file re-runs the build and refreshes the android-latest release.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "sw.js"
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare_android_www.mjs"
      - "capacitor.config.json"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Stage web assets
        run: npm run android:www

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gunpula-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gunpula-debug-apk
          path: gunpula-debug.apk

      - name: Publish APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Android APK (debug)" \
              --notes "Latest debug APK built from main. Download gunpula-debug.apk and install it directly (allow unknown sources)."
          gh release upload android-latest gunpula-debug.apk --clobber
