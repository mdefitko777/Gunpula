name: Refresh official catalog

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-catalog.yml"
      - "package.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh-official-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot current catalog
        run: cp data/kits.json "$RUNNER_TEMP/kits-before.json"

      - name: Import official sources
        run: npm run import:data

      - name: Translate kana display names to Korean
        run: node scripts/translate_kana_names.mjs

      - name: Build update feed
        run: npm run updates -- --before="$RUNNER_TEMP/kits-before.json"

      - name: Build search assets
        run: npm run market

      - name: Split catalog into per-franchise app files
        run: npm run split

      - name: Validate catalog
        run: |
          npm run validate
          npm run duplicates
          npm run audit:gundam-series
          npm run validate

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data app/assets; then
            echo "No catalog updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/assets
          git commit -m "Refresh official catalog data"
          # Generated data files (timestamps, market prices, search index) change
          # every run, so a plain rebase against a concurrently-updated remote hits
          # unresolvable conflicts. Rebase with -X theirs (keep this run's fresh data)
          # and retry, so overlapping runs can't fail the job on a push race.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected (remote moved); retrying..."
            else
              echo "Rebase conflict; aborting and retrying against latest remote..."
              git rebase --abort || true
            fi
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "Could not push after 5 attempts."
          exit 1
