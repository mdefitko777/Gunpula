name: Refresh official catalog

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-catalog.yml"
      - "package.json"
      - "scripts/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-official-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot current catalog
        run: cp data/kits.json "$RUNNER_TEMP/kits-before.json"

      # Keeps going past a failed source (its previous data stays) and lists the
      # failed steps in import-failures.txt for the report step below.
      - name: Import official sources
        env:
          IMPORT_FAILURES_PATH: ${{ runner.temp }}/import-failures.txt
          # build_restocks.mjs (atlas:restocks step) compares release months with the
          # catalog as it was before this run.
          RESTOCK_BEFORE_PATH: ${{ runner.temp }}/kits-before.json
          # localize_catalog.mjs: a batch of series moves keeps the series published before this run.
          LOCALIZE_BASELINE_PATH: ${{ runner.temp }}/kits-before.json
        run: npm run import:data

      - name: Translate kana display names to Korean
        run: node scripts/translate_kana_names.mjs

      - name: Apply curated Korean names
        run: node scripts/apply_ko_names.mjs

      # Simplified Chinese names (curated data/i18n/names-zh.json, else the glossaries in
      # data/i18n/zh/) and Chinese search words for the Chinese UI of Hobby Atlas.
      - name: Apply Chinese names
        run: node scripts/apply_zh_names.mjs

      # Covers on hosts that do not serve apps reliably (bsp-prize.jp answers a
      # bot check part of the time, Pokémon Center Online refuses hotlinks) are
      # kept in app/assets. Polite mode: bot user agent, robots.txt, one request
      # per host at a time, and a host that refuses is left until the next run,
      # so the remaining covers fill in over a few days. Only uncached covers
      # are requested.
      - name: Cache covers of hosts that block apps
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm run cache:madoka-images
          npm run cache:pokemon-center-images

      # Release dates of new products whose source list has none, read from their
      # product pages (Aniplex+, gashapon.jp) with the same polite rules; at most
      # 300 pages a run. Dates already read are put back by import:data (dates:apply).
      - name: Read missing release dates
        continue-on-error: true
        timeout-minutes: 12
        run: npm run dates:backfill -- --limit=300

      # Photo counts of new archived Premium Bandai items on the Bandai CDN (HEAD
      # probes, same polite rules, at most 40 items a run); import:data adds the
      # counted photos (pb:gallery).
      - name: Count Premium Bandai photos
        continue-on-error: true
        timeout-minutes: 8
        run: npm run pb:gallery:fetch -- --limit=40

      # Official assembly manual list (manual.bandai-hobby.net, ~140 pages), read at
      # most once a week with the same polite rules; after one complete read only the
      # new pages are read, and a failed page keeps what was read. Links records by
      # name (manual_id) even when the read fails.
      - name: Read official manual list
        continue-on-error: true
        timeout-minutes: 6
        run: npm run manuals:fetch

      - name: Build update feed
        run: npm run updates -- --before="$RUNNER_TEMP/kits-before.json"

      - name: Build search assets
        run: npm run market

      - name: Split catalog into per-franchise app files
        run: npm run split

      - name: Validate catalog
        run: |
          npm run validate
          npm run duplicates
          npm run audit:gundam-series
          npm run validate

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data app/assets; then
            echo "No catalog updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/assets
          git commit -m "Refresh official catalog data"
          # Generated data files (timestamps, market prices, search index) change
          # every run, so a plain rebase against a concurrently-updated remote hits
          # unresolvable conflicts. Rebase with -X theirs (keep this run's fresh data)
          # and retry, so overlapping runs can't fail the job on a push race.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              # -X theirs merges kits.json / atlas-groups.json hunk by hunk, which can
              # duplicate records, undo curated Korean names or leave a group's count
              # out of step with its kit_ids. Re-derive those from the merged catalog
              # and don't push a catalog that fails validation.
              node scripts/dedupe_kit_ids.mjs
              node scripts/apply_ko_names.mjs
              node scripts/apply_zh_names.mjs
              node scripts/build_atlas_groups.mjs
              npm run split
              npm run validate
              if ! git diff --quiet -- data; then
                git add data
                git commit -q --amend --no-edit
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected (remote moved); retrying..."
            else
              echo "Rebase conflict; aborting and retrying against latest remote..."
              git rebase --abort || true
            fi
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "Could not push after 5 attempts."
          exit 1

      # Silent failures are the real risk here: a scrape can break for weeks
      # before anyone notices the catalog stopped growing. Open (or reuse) one
      # issue so a broken daily refresh is visible. A run that committed but had
      # failed sources is reported too; this runs after the commit, so it never blocks it.
      - name: Report failure
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          FAILURES_PATH: ${{ runner.temp }}/import-failures.txt
        run: |
          failed_steps=""
          if [ -s "$FAILURES_PATH" ]; then
            failed_steps=$(sed 's/^/- /' "$FAILURES_PATH")
          fi
          if [ "$JOB_STATUS" = "success" ] && [ -z "$failed_steps" ]; then
            echo "Nothing to report."
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "success" ]; then
            body="Run succeeded, but these import steps failed and kept their previous data: $run_url ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          else
            body="Run failed: $run_url ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          fi
          if [ -n "$failed_steps" ]; then
            body="$body"$'\n\n'"$failed_steps"
          fi
          title="每日目录抓取失败"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "" || gh issue create --title "$title" --body "$body"
          fi
