name: Refresh official catalog

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-catalog.yml"
      - "package.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh-official-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot current catalog
        run: cp data/kits.json "$RUNNER_TEMP/kits-before.json"

      - name: Import official sources
        run: npm run import:data

      - name: Build update feed
        run: npm run updates -- --before="$RUNNER_TEMP/kits-before.json"

      - name: Build market/search assets
        run: npm run market

      - name: Validate catalog
        run: |
          npm run validate
          npm run duplicates
          npm run audit:gundam-series
          npm run validate

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data app/assets; then
            echo "No catalog updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/assets
          git commit -m "Refresh official catalog data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
