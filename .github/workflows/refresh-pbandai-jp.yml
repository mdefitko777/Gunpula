name: Refresh Premium Bandai Japan

on:
  schedule:
    - cron: "5 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-premium-bandai-japan
  cancel-in-progress: false

jobs:
  refresh:
    # This must be a Japan-based self-hosted runner. GitHub-hosted runners are
    # redirected to https://p-bandai.jp/global_newpc.html and cannot fetch JP PB.
    runs-on: [self-hosted, linux, pbandai-jp]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Crawl Premium Bandai Japan
        run: npm run refresh:pb:japan

      - name: Build app data
        run: |
          npm run updates
          npm run split
          npm run market
          npm run validate

      - name: Commit Premium Bandai cache
        run: |
          if git diff --quiet -- data app/assets; then
            echo "No Premium Bandai updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/assets
          git commit -m "Refresh Premium Bandai Japan cache"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
