name: Atlas Gundam MS data

# Weekly refresh of the Hobby Atlas Gundam MS master and kit <-> MS links
# (data/atlas/gundam-*). Sources: soshage.com GGET API, Bandai Hobby WEB取説, and (only after a
# human confirmed Fandom's robots/API policy) Gunplapedia + Gundam Wiki via the MediaWiki API.
# Fandom's robots.txt answers our bot with a Cloudflare challenge, so the Fandom steps stay off
# until the repository variable ATLAS_FANDOM_CONFIRMED is set to 1 (or a manual run ticks
# "fandom_confirmed"); meanwhile the committed Fandom snapshots are used.
# Every fetch step keeps its previous snapshot when a source fails, and the build refuses to
# overwrite outputs on a large drop in linked kits or localized MS names.
# A second step rebuilds "what is in each chapter" (data/atlas/gundam-chapters.json) from the
# Gundam Wiki episode pages (SMW; same Fandom gate), soshage.com G Gen ETERNAL story stages and
# the official gundam-official.com episode subtitles, keyed by the MS ids of the fresh MS master
# and carrying each unit's kit ids from gundam-kit-ms.json.
# Only data/atlas/gundam-* is ever committed.

on:
  schedule:
    - cron: "40 19 * * 0" # Sundays 19:40 UTC (Mondays 04:40 KST)
  workflow_dispatch:
    inputs:
      build_only:
        description: "Rebuild from committed snapshots without fetching"
        type: boolean
        default: false
      full_manual:
        description: "Re-read every WEB取説 listing page"
        type: boolean
        default: false
      fandom_confirmed:
        description: "I checked Fandom's robots.txt / API policy and this run may read gunpla.fandom.com and gundam.fandom.com"
        type: boolean
        default: false
      all_stages:
        description: "Re-read every G Gen story stage (default: only stages new since the last snapshot)"
        type: boolean
        default: false
  # Re-link after the catalogue changes (offline build, no network fetch).
  workflow_run:
    workflows: ["Refresh official catalog"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: atlas-gundam
  cancel-in-progress: false

jobs:
  gundam:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # app/assets is ~800 MB and not needed here.
          sparse-checkout: |
            /*
            !/app/assets/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One HTTP cache entry per ISO week (not per run); build-only runs neither restore nor save it.
      - name: Cache key
        id: week
        if: github.event_name != 'workflow_run' && !inputs.build_only
        run: echo "key=atlas-gundam-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore HTTP cache
        if: steps.week.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-cache
          key: ${{ steps.week.outputs.key }}
          restore-keys: atlas-gundam-

      - name: Fetch sources and build
        timeout-minutes: 50
        env:
          ATLAS_CACHE_DIR: ${{ runner.temp }}/atlas-cache
          ATLAS_MANUAL_FULL: ${{ inputs.full_manual && '1' || '' }}
          ATLAS_FANDOM_CONFIRMED: ${{ (vars.ATLAS_FANDOM_CONFIRMED == '1' || inputs.fandom_confirmed) && '1' || '' }}
          BUILD_ONLY: ${{ (github.event_name == 'workflow_run' || inputs.build_only) && '1' || '' }}
        run: |
          if [ "$BUILD_ONLY" = "1" ]; then
            node scripts/atlas/run_gundam.mjs --build
          else
            node scripts/atlas/run_gundam.mjs
          fi

      # Needs data/atlas/gundam-ms.json + gundam-kit-ms.json from the step above (MS ids = the
      # master's ids, kit ids = its kit links), so chapters refresh on the same schedule.
      # A chapters failure must not hold back the MS data: the chapter build already refuses
      # to overwrite gundam-chapters.json on a large drop, so the commit step can still run.
      - name: Fetch chapter sources and build chapters
        timeout-minutes: 30
        continue-on-error: true
        env:
          ATLAS_CACHE_DIR: ${{ runner.temp }}/atlas-cache
          ATLAS_GGET_STAGES: ${{ inputs.all_stages && 'all' || 'new' }}
          ATLAS_FANDOM_CONFIRMED: ${{ (vars.ATLAS_FANDOM_CONFIRMED == '1' || inputs.fandom_confirmed) && '1' || '' }}
          BUILD_ONLY: ${{ (github.event_name == 'workflow_run' || inputs.build_only) && '1' || '' }}
        run: |
          if [ "$BUILD_ONLY" = "1" ]; then
            node scripts/atlas/run_gundam_chapters.mjs --build
          else
            node scripts/atlas/run_gundam_chapters.mjs
          fi
          # Chapter units must point at ids of this run's MS master and kit links; otherwise
          # keep the committed chapter files so the app never sees dangling ids.
          if ! node scripts/atlas/check_gundam_chapters.mjs; then
            git checkout -- data/atlas/gundam-chapters.json data/atlas/gundam-chapters-review.json
            exit 1
          fi

      - name: Save HTTP cache
        if: always() && steps.week.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/atlas-cache
          key: ${{ steps.week.outputs.key }}
        continue-on-error: true # the week's entry may already exist

      - name: Commit updated Atlas Gundam data
        run: |
          if git diff --quiet -- 'data/atlas/gundam-*' && [ -z "$(git ls-files --others --exclude-standard -- 'data/atlas/gundam-*')" ]; then
            echo "No Atlas Gundam updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/atlas/gundam-* covers the MS master, kit links, data/atlas/gundam-chapters.json,
          # the chapter review list and every gundam-src-* snapshot.
          git add -- 'data/atlas/gundam-*'
          git commit -m "Update Atlas Gundam MS and chapter data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs "origin/main"; then
              if git push origin "HEAD:main"; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected (remote moved); retrying..."
            else
              echo "Rebase conflict; aborting and retrying against latest remote..."
              git rebase --abort || true
            fi
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "Could not push after 5 attempts."
          exit 1
