name: Image search vectors

# Hobby Atlas "생김새로 찾기": the on-device image model (LiteRT, converted once) and the catalog's image vectors
# (weekly, incremental). Both are assets of the `imgsim` release; the app downloads them on first use.
#   siglip2-b32-256-wi8.tflite  SigLIP2 ViT-B/32-256 image tower, int8 weights (Apache-2.0)
#   imgsim-vectors.bin          one int8 vector per product image (scripts/imgsim/build_vectors.py)
#   imgsim.json                 what the app checks: file names, sizes, sha256, update time

on:
  schedule:
    - cron: "20 20 * * 0"
  workflow_dispatch:
    inputs:
      reconvert:
        description: "Convert the model again (otherwise only when the release has none)"
        type: boolean
        default: false
  push:
    branches:
      - "imgsim/**"

permissions:
  contents: write

concurrency:
  group: imgsim
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  MODEL: siglip2-b32-256-wi8.tflite

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Release and current assets
        run: |
          gh release view imgsim >/dev/null 2>&1 || gh release create imgsim --latest=false \
            --title "Image search data (Hobby Atlas)" \
            --notes "On-device image search for Hobby Atlas. Model: SigLIP2 ViT-B/32-256 image tower (google, Apache-2.0, via open_clip), int8 weights. Vectors: one per catalog image, rebuilt weekly by .github/workflows/imgsim.yml."
          mkdir -p prev out
          gh release download imgsim -D prev --clobber || true
          ls -la prev

      - name: Convert model
        if: ${{ inputs.reconvert || hashFiles('prev/siglip2-b32-256-wi8.tflite') == '' }}
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ai-edge-torch ai-edge-quantizer ai-edge-litert open_clip_torch timm
          python scripts/imgsim/convert_model.py out
          cp out/$MODEL prev/$MODEL
          gh release upload imgsim out/$MODEL out/model.json --clobber
          cp out/model.json prev/model.json

      - name: Build vectors
        run: |
          pip install ai-edge-litert pillow numpy
          python scripts/imgsim/build_vectors.py . prev/$MODEL out/imgsim-vectors.bin --prev prev/imgsim-vectors.bin --budget-min 240

      - name: Publish
        run: |
          python - <<'EOF'
          import hashlib, json, os
          base = 'https://github.com/mdefitko777/Gunpula/releases/download/imgsim/'
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''):
                      h.update(b)
              return h.hexdigest()
          model = json.load(open('prev/model.json'))
          mp = 'prev/' + model['file']
          model.update(url=base + model['file'], bytes=os.path.getsize(mp), sha256=sha(mp))
          s = json.load(open('out/imgsim-vectors.bin.summary.json'))
          meta = json.loads(open('out/imgsim-vectors.bin', 'rb').read()[20:20 + int.from_bytes(open('out/imgsim-vectors.bin', 'rb').read()[16:20], 'little')])
          vec = dict(file='imgsim-vectors.bin', url=base + 'imgsim-vectors.bin', bytes=s['bytes'], sha256=sha('out/imgsim-vectors.bin'),
                     rows=s['rows'], kits=s['kits'], updated=meta['updated'], model=meta['model'])
          json.dump(dict(schema=1, model=model, vectors=vec), open('out/imgsim.json', 'w'), indent=1)
          print(json.dumps(s))
          EOF
          cat out/imgsim.json
          gh release upload imgsim out/imgsim-vectors.bin out/imgsim.json --clobber
